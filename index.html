async function sf10Edit(r,drivers,legacy){try{

 function draw(){ $('#sfitems').innerHTML=items.map((i,j)=>`<div class="sf10item"><div><label>Produto</label><input data-si="${j}" data-sk="produto" value="${esc(i.produto)}" required></div><div><label>Ano</label><input type="number" min="1900" max="2200" step="1" data-si="${j}" data-sk="ano" value="${esc(i.ano??'')}"></div><div><label>Qtd.</label><input type="number" min="0.001" step="0.001" data-si="${j}" data-sk="quantidade" value="${esc(i.quantidade)}" required></div><button type="button" class="alt" data-sremove="${j}" aria-label="Remover">×</button></div>`).join('');modal.querySelectorAll('[data-si]').forEach(el=>el.oninput=()=>items[+el.dataset.si][el.dataset.sk]=el.value);modal.querySelectorAll('[data-sremove]').forEach(el=>el.onclick=()=>{items.splice(+el.dataset.sremove,1);draw()})}
 function calc(){let t=num(f.elements.valor_total.value),p=f.elements.pagamento.value,a=p==='pago'?t:p==='parcial'?num(f.elements.valor_antecipado.value):0;$('#sfadvance').hidden=p!=='parcial';$('#sfdue').textContent='A receber na entrega: '+money(p==='fiado'?0:Math.max(0,t-a));return a}
 draw();calc();f.oninput=calc;$('#sfadditem').onclick=()=>{items.push({produto:'Galão de água',ano:'',quantidade:1});draw()};$('#close').onclick=()=>modal.close();
 function fillClient(c){if(!c)return;f.elements.nome_cliente.value=c.nome||'';f.elements.endereco.value=[c.endereco,c.cidade].filter(Boolean).join(' — ');f.elements.telefone.value=c.whatsapp||c.telefone||''}

 f.onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{let x=Object.fromEntries(new FormData(f));let a=calc();let t=num(x.valor_total);if(!items.length||items.some(i=>!String(i.produto).trim()||num(i.quantidade)<=0||(i.ano&&!Number.isInteger(num(i.quantidade)))))throw Error('Confira os produtos, anos e quantidades.');if(x.pagamento==='parcial'&&!(a>0&&a<t))throw Error('Informe um adiantamento menor que o total.');if(r&&num(r.valor_recebido_entrega)>0)throw Error('Esta entrega já tem recebimento. Corrija o recebimento antes de editar.');let sale=available.find(s=>s.id===x.venda_id);if(sale&&num(sale.valor_total)!==t)throw Error('O valor deve coincidir com a venda vinculada.');let data={venda_id:x.venda_id||null,entregador_id:x.entregador_id,data_entrega:x.data_entrega,nome_cliente:x.nome_cliente.trim(),endereco:x.endereco.trim(),telefone:x.telefone||null,itens:items.map(i=>({produto:String(i.produto).trim(),ano:i.ano?num(i.ano):null,quantidade:num(i.quantidade)})),valor_total:t,pagamento:x.pagamento,valor_antecipado:a,observacoes:x.observacoes||null};await run(r?db.from('ordens_entrega').update(data).eq('empresa_id',eid).eq('id',r.id):db.from('ordens_entrega').insert({...data,empresa_id:eid}));sf10Day=x.data_entrega;modal.close();render()}catch(err){msg(err,$('#modalmsg'))}finally{e.submitter.disabled=false}};

function sf10Update(r){let eid=company.id;open('Atualizar entrega',select('situacao','Situação',Object.entries(sf10Status).map(([id,nome])=>({id,nome})),r.situacao,true)+`<div id="sfpaid">${field('valor_recebido_entrega','Recebido do cliente (R$)','number',r.valor_recebido_entrega,'min="0" step="0.01"')}${select('forma_recebimento','Forma de recebimento',opts(['dinheiro','pix','cartao','misto','outros']),r.forma_recebimento)}${field('valor_com_entregador','Valor em mãos do entregador (R$)','number',r.valor_com_entregador,'min="0" step="0.01"')}</div>${field('motivo_nao_entrega','Motivo (se não entregue)','text',r.motivo_nao_entrega)}${field('recebido_por','Recebido por','text',r.recebido_por)}`,async f=>{let done=f.situacao==='entregue',v=done?num(f.valor_recebido_entrega):0,rep=done?num(f.valor_com_entregador):0;if(v>num(r.valor_a_cobrar)||rep>v||v<0||rep<0)throw Error('Confira os valores recebidos e em mãos.');if(v&&!f.forma_recebimento)throw Error('Informe a forma de recebimento.');if(f.situacao==='nao_entregue'&&!f.motivo_nao_entrega.trim())throw Error('Informe o motivo.');await run(db.from('ordens_entrega').update({situacao:f.situacao,valor_recebido_entrega:v,valor_com_entregador:rep,forma_recebimento:done&&v?f.forma_recebimento:null,motivo_nao_entrega:f.motivo_nao_entrega||null,recebido_por:f.recebido_por||null}).eq('empresa_id',eid).eq('id',r.id))});let f=$('#mf');let sync=()=>{$('#sfpaid').hidden=f.elements.situacao.value!=='entregue'};f.elements.situacao.onchange=sync;sync()}
function sf10Drivers(drivers){modal.innerHTML=`<h2>Entregadores</h2>${drivers.map((d,i)=>`<div class="sf10driver"><b>${esc(d.nome)}</b> <small>${esc(d.whatsapp||d.telefone||'Sem WhatsApp')}</small><button class="alt" data-sfdriver="${i}">Editar</button></div>`).join('')}<div class="actions"><button id="sfnewdriver">+ Novo entregador</button><button id="close" class="alt">Voltar</button></div>`;if(!modal.open)modal.showModal();let eid=company.id;function edit(d){modal.close();open(d?'Editar entregador':'Novo entregador',field('nome','Nome','text',d?.nome,'required')+field('whatsapp','WhatsApp com DDD','tel',d?.whatsapp||d?.telefone,'required'),async f=>{let phone=sf10Phone(f.whatsapp);if(!phone)throw Error('Informe um WhatsApp brasileiro com DDD.');let data={nome:f.nome.trim(),whatsapp:phone,telefone:phone};await run(d?db.from('entregadores').update(data).eq('empresa_id',eid).eq('id',d.id):db.from('entregadores').insert({...data,empresa_id:eid}))})}$('#sfnewdriver').onclick=()=>edit();$('#close').onclick=()=>modal.close();modal.querySelectorAll('[data-sfdriver]').forEach(b=>b.onclick=()=>edit(drivers[+b.dataset.sfdriver]))}
async function sf10Close(driver,list){try{let eid=company.id,day=sf10Day;let old=await run(db.from('fechamentos_entregador').select('*').eq('empresa_id',eid).eq('entregador_id',driver.id).eq('data_entrega',day).maybeSingle());if(company?.id!==eid||sf10Day!==day)return;let done=list.filter(r=>r.situacao==='entregue'),pending=list.filter(r=>['pendente','em_rota'].includes(r.situacao)),not=list.filter(r=>r.situacao==='nao_entregue'),rep=sum(done,'valor_com_entregador'),paid=sum(done,'valor_recebido_entrega'),due=sum(done,'valor_a_cobrar'),years={};done.forEach(r=>r.itens.forEach(i=>{let k=i.ano||'Sem ano';years[k]=(years[k]||0)+num(i.quantidade)}));let summary=`<p><b>${esc(driver.nome)}</b> · ${date(day)}</p><p>Entregues: ${done.length} · Pendentes: ${pending.length} · Não entregues: ${not.length}</p><p>Itens entregues por ano: ${esc(Object.entries(years).map(([k,v])=>`${k}: ${v}`).join(' • ')||'—')}</p><p>Previsto cobrar: ${money(due)} · Recebido: ${money(paid)} · Falta receber: ${money(due-paid)}</p><p>Valor em mãos do entregador: <b>${money(rep)}</b></p>`;open('Fechamento diário',`<div style="grid-column:1/-1">${summary}${old?'<p class="muted">Fechamento já registrado. Os totais refletem o estado atual das entregas.</p>':''}</div>${field('valor_repassado','Valor repassado (R$)','number',old?.valor_repassado??rep,'min="0" step="0.01" required')}${field('observacoes','Justificativa / observações','text',old?.observacoes)}<div id="sfdiff" class="sf10due"></div>`,async f=>{if(num(f.valor_repassado)!==rep&&!f.observacoes.trim())throw Error('Informe a justificativa da diferença.');if(pending.length&&!confirm('Há entregas pendentes. Deseja salvar mesmo assim?'))throw Error('Fechamento não salvo.');let data={valor_repassado:num(f.valor_repassado),observacoes:f.observacoes||null,fechado_em:new Date().toISOString(),fechado_por:user.id};await run(old?db.from('fechamentos_entregador').update(data).eq('empresa_id',eid).eq('id',old.id):db.from('fechamentos_entregador').insert({...data,empresa_id:eid,entregador_id:driver.id,data_entrega:day}))});let f=$('#mf'),calc=()=>$('#sfdiff').textContent='Diferença: '+money(num(f.elements.valor_repassado.value)-rep);f.oninput=calc;calc();let b=document.createElement('button');b.type='button';b.className='alt';b.textContent='PDF';b.onclick=()=>sf10Print('Fechamento diário',summary+`<p>Repasse informado: ${money(f.elements.valor_repassado.value)} · Diferença: ${money(num(f.elements.valor_repassado.value)-rep)}</p><p>${esc(f.elements.observacoes.value)}</p>`);f.querySelector('.actions').append(b)}catch(e){alert(e.message)}}

async function sf10Legacy(id){try{let [d,e,v]=await Promise.all(['entregas_resumo','entregadores','vendas'].map(t=>rows(t)));if(id!==seq)return;listPage('Nova entrega');$('#add').onclick=()=>open('Nova entrega',select('venda_id','Venda',v.filter(r=>r.situacao==='confirmada'&&r.tipo_atendimento==='entrega'&&!d.some(x=>x.venda_id===r.id)).map(r=>({id:r.id,nome:`Venda ${r.numero} — ${money(r.valor_total)}`})),'',true)+field('nome_cliente','Nome do cliente','text','','required')+field('endereco','Endereço','text','','required')+field('telefone','Telefone')+field('bairro','Bairro')+field('ponto_referencia','Referência')+select('entregador_id','Entregador',e),f=>rpc('criar_entrega',Object.fromEntries(Object.entries(clean(f)).map(([k,v])=>['p_'+k,v]))));searchTable(d,[['Cliente','nome_cliente'],['Endereço','endereco'],['Entregador','nome_entregador'],['Situação','situacao'],['Valor',r=>money(r.valor_total)]],'Atualizar',r=>open('Atualizar entrega',select('situacao','Situação',opts(['pendente','em_separacao','pronto','saiu_para_entrega','entregue','nao_entregue','cancelado']),r.situacao,true)+select('entregador_id','Entregador',e,r.entregador_id)+field('observacoes','Observações')+field('recebido_por','Recebido por'),f=>rpc('atualizar_entrega',{p_entrega_id:r.id,...Object.fromEntries(Object.entries(clean(f)).map(([k,v])=>['p_'+k,v]))})));let b=document.createElement('button');b.textContent='Novo entregador';b.className='alt';$('.toolbar').append(b);b.onclick=()=>open('Novo entregador',field('nome','Nome','text','','required')+field('telefone','Telefone')+field('veiculo','Veículo'),f=>run(db.from('entregadores').insert({...clean(f),empresa_id:company.id})));$('#add').textContent='Voltar à central';$('#add').onclick=()=>render();}catch(e){msg(e)}}


function sf101Edit(r,i){
 const amount=(name,label,value,step='0.01')=>field(name,label,'number',String(value??0),`min="0" step="${step}" required`);
 const extra=Math.max(0,num(r.frete)-num(r.custo_combustivel)-num(r.custo_oleo)-num(r.outros_custos));
 modal.innerHTML=`<h2>Editar compra</h2><p class="muted">${esc(i.produtos?.nome||'Produto')} · ${esc(r.data_compra)}</p><form id="sf101form"><div class="grid">${amount('quantidade','Quantidade',i.quantidade,'0.001')}${amount('valor_lote','Valor total da mercadoria',i.valor_total)}${amount('combustivel','Combustível',r.custo_combustivel)}${amount('oleo','Óleo',r.custo_oleo)}${amount('outros','Outros custos',r.outros_custos)}</div><p class="muted">Frete adicional: ${money(extra)} · Desconto: ${money(r.desconto)}</p><div class="notice" id="sf101calc"></div>${field('motivo','Motivo da correção','text','','required')}<p class="muted">O sistema confere o histórico de estoque, vendas e pagamento antes de salvar. Compras com caixa fechado podem exigir revisão.</p><div id="modalmsg"></div><div class="actions"><button type="submit">Salvar alterações</button><button class="alt" type="button" id="sf101back">Voltar</button></div></form>`;
 const f=$('#sf101form'); f.elements.quantidade.min='0.001';
 const calc=()=>{const x=Object.fromEntries(new FormData(f)),q=num(x.quantidade),t=num(x.valor_lote)+num(x.combustivel)+num(x.oleo)+num(x.outros)+extra-num(r.desconto);$('#sf101calc').textContent='Total: '+money(t)+' · Custo do lote por unidade: '+(q>0?money(t/q):'—');};
 f.oninput=calc;calc();$('#sf101back').onclick=()=>{modal.close();detail(false,r)};
 f.onsubmit=async e=>{e.preventDefault();if(!confirm('Confirma a correção da compra?'))return;const x=Object.fromEntries(new FormData(f));const b=f.querySelector('button[type=submit]');b.disabled=true;try{await rpc('sf101_editar_compra',{p_compra_id:r.id,p_quantidade:num(x.quantidade),p_valor_lote:num(x.valor_lote),p_combustivel:num(x.combustivel),p_oleo:num(x.oleo),p_outros:num(x.outros),p_motivo:x.motivo});modal.close();await render();alert('Compra corrigida com sucesso.')}catch(e){msg(e,$('#modalmsg'));b.disabled=false;}};
}
