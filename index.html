async function pdv(){try{const setor=company.id;let [p,c,e]=await Promise.all([rows('produtos'),rows('clientes'),rows('estoque_atual')]);if(company?.id!==setor||page!=='Vendas')return;p=p.filter(r=>r.ativo);c=c.filter(r=>r.ativo);if(!p.length)return alert('Cadastre produtos primeiro.');const stock=new Map(e.map(r=>[r.produto_id,num(r.quantidade_estoque)]));let cart=new Map();modal.classList.add('pdv-dialog');modal.addEventListener('close',()=>modal.classList.remove('pdv-dialog'),{once:true});modal.innerHTML=`<div class="pdv-head"><div><small>FRENTE DE CAIXA • ${esc(company.nome)}</small><h2>Nova venda</h2></div><button class="alt" id="pdvclose">Fechar ×</button></div><form id="pdvf"><div class="pdv-layout"><section class="pdv-panel"><h3>Escolha os produtos</h3><input class="pdv-search" id="pdvq" placeholder="Buscar nome ou código de barras" autocomplete="off"><div id="pdvproducts" class="pdv-products"></div></section><section class="pdv-panel"><h3>Itens da venda <small id="pdvcount"></small></h3><div id="pdvcart" class="pdv-cart"></div><div class="pdv-fields">${select('pessoa','Cliente (opcional)',c)}${field('data','Data','date',today(),'required')}${select('atendimento','Atendimento',opts(['balcao','entrega','retirada']),'balcao',true)}${field('taxa','Taxa de entrega','number',0,'min="0" step="0.01" required')}${field('desconto','Desconto','number',0,'min="0" step="0.01" required')}${select('forma','Pagamento',[{id:'pix',nome:'Pix'},{id:'dinheiro',nome:'Dinheiro'},{id:'debito',nome:'Cartão de débito'},{id:'credito',nome:'Cartão de crédito'},{id:'transferencia',nome:'Transferência'},{id:'fiado',nome:'Fiado'}],'pix',true)}<div id="pdvdue" class="wide hidden">${field('vencimento','Vencimento do fiado','date')}</div><div class="wide">${field('obs','Observações')}</div></div><div class="pdv-total"><span>Total da venda</span><strong id="pdvtotal">R$ 0,00</strong></div><div id="modalmsg"></div><button class="pdv-confirm" type="submit">Confirmar venda</button></section></div></form>`;modal.showModal();const f=$('#pdvf');function calc(){let sub=[...cart.values()].reduce((a,l)=>a+Math.round(l.q*l.price*100)/100,0);let total=Math.round((sub-num(f.desconto.value)+num(f.taxa.value))*100)/100;$('#pdvtotal').textContent=money(total);$('#pdvcount').textContent=`(${cart.size})`;return {sub,total}}function products(){let q=$('#pdvq').value.trim().toLowerCase();let filtered=p.filter(r=>[r.nome,r.codigo_barras,r.codigo_interno].some(v=>String(v||'').toLowerCase().includes(q)));$('#pdvproducts').innerHTML=filtered.map(r=>`<button type="button" class="pdv-product" data-p="${r.id}" ${stock.get(r.id)>0?'':'disabled'}><span>${esc(r.nome)}</span><strong>${money(r.preco_venda)}</strong><small>Estoque: ${stock.get(r.id)||0} ${esc(r.unidade)}</small></button>`).join('')||'<div class="pdv-empty">Nenhum produto encontrado.</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>add(b.dataset.p))}function add(id){let r=p.find(x=>x.id===id),l=cart.get(id);if((l?.q||0)+1>(stock.get(id)||0)){if(!l&&stock.get(id)>0)cart.set(id,{id,q:stock.get(id),price:num(r.preco_venda)});else return; }else if(l)l.q+=1;else cart.set(id,{id,q:1,price:num(r.preco_venda)});draw()}function draw(){ $('#pdvcart').innerHTML=[...cart.values()].map(l=>`<div class="pdv-item"><div><strong>${esc(p.find(r=>r.id===l.id).nome)}</strong><div class="qty"><button type="button" class="alt" data-minus="${l.id}">−</button><input aria-label="Quantidade" type="number" min="0.001" max="${stock.get(l.id)}" step="0.001" required value="${l.q}" data-q="${l.id}"><button type="button" class="alt" data-plus="${l.id}">+</button></div><div class="price">Preço R$ <input aria-label="Preço unitário" type="number" min="0" step="0.01" required value="${l.price}" data-price="${l.id}"></div></div><div style="text-align:right"><strong data-line="${l.id}">${money(l.q*l.price)}</strong><div><button type="button" class="alt" data-remove="${l.id}" aria-label="Remover item">×</button></div></div></div>`).join('')||'<div class="pdv-empty">Adicione produtos para iniciar.</div>';for(let b of document.querySelectorAll('[data-minus]'))b.onclick=()=>{let l=cart.get(b.dataset.minus);if(l.q<=1)cart.delete(l.id);else l.q-=1;draw()};for(let b of document.querySelectorAll('[data-plus]'))b.onclick=()=>add(b.dataset.plus);for(let b of document.querySelectorAll('[data-remove]'))b.onclick=()=>{cart.delete(b.dataset.remove);draw()};for(let b of document.querySelectorAll('[data-q],[data-price]'))b.oninput=()=>{let l=cart.get(b.dataset.q||b.dataset.price);l[b.dataset.q?'q':'price']=Number(b.value);document.querySelector(`[data-line="${l.id}"]`).textContent=money(l.q*l.price);calc()};calc()}$('#pdvq').oninput=products;$('#pdvq').onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();let q=ev.target.value.trim();let r=p.find(r=>q&&[r.codigo_barras,r.codigo_interno].includes(q));if(r){add(r.id);ev.target.value='';products()}}};f.oninput=()=>{let fiado=f.forma.value==='fiado';$('#pdvdue').classList.toggle('hidden',!fiado);f.vencimento.required=fiado;calc()};$('#pdvclose').onclick=()=>modal.close();products();draw();f.onsubmit=async ev=>{ev.preventDefault();let b=ev.submitter;b.disabled=true;$('#pdvclose').disabled=true;try{let x=Object.fromEntries(new FormData(f)),{sub,total}=calc();if(!cart.size||total<=0||num(x.desconto)>sub)throw Error('Confira produtos, desconto e total.');for(let l of cart.values())if(!Number.isFinite(l.q)||l.q<=0||l.q>stock.get(l.id)||!Number.isFinite(l.price)||l.price<0)throw Error('Confira as quantidades e preços.');if(x.forma==='fiado'&&(!x.pessoa||!x.vencimento))throw Error('Selecione cliente e vencimento para o fiado.');await rpc('registrar_operacao_app',{p_empresa_id:setor,p_venda:true,p_dados:x,p_itens:[...cart.values()].map(l=>({produto_id:l.id,quantidade:l.q,preco:l.price}))});modal.close();await render()}catch(err){msg(err,$('#modalmsg'))}finally{b.disabled=false;let close=$('#pdvclose');if(close)close.disabled=false}}}catch(err){msg(err)}}
async function transaction(sale){try{let [p,c]=await Promise.all([rows('produtos'),rows(sale?'clientes':'fornecedores')]);p=p.filter(r=>r.ativo);if(!p.length)return alert('Cadastre produtos primeiro.');let ca=sale?[]:await rows('contas_caixa');let lines=[];let form=field('data',sale?'Data da venda':'Data da compra','date',today(),'required')+select('pessoa',sale?'Cliente (opcional)':'Fornecedor',c)+ (sale?select('atendimento','Atendimento',opts(['balcao','entrega','retirada']),'balcao',true)+field('taxa','Taxa de entrega','number',0,'min="0" step="0.01" required'):field('nota','Número da nota')+field('frete','Frete','number',0,'min="0" step="0.01" required'))+field('desconto','Desconto','number',0,'min="0" step="0.01" required')+select('forma','Forma de pagamento',opts(sale?['dinheiro','pix','debito','credito','transferencia','fiado']:['dinheiro','pix','debito','credito','boleto','transferencia','a_prazo']),'pix',true)+field('vencimento','Vencimento','date')+(!sale?select('conta','Conta para pagamento',ca)+field('pago','Valor pago (vazio = total à vista)','number','','min="0" step="0.01"'):'')+field('obs','Observações');modal.innerHTML=`<h2>${sale?'Nova venda':'Nova compra'}</h2><form id="tf"><div class="grid">${form}</div><h2 style="margin-top:20px">Produtos</h2><div id="lines"></div><button type="button" id="addline" class="alt">+ Produto</button><div class="metric" id="total"></div><div id="modalmsg"></div><div class="actions"><button type="submit">Confirmar</button><button type="button" class="alt" id="close">Voltar</button></div></form>`;modal.showModal();const f=$('#tf');function calc(){let total=lines.reduce((s,l)=>s+Math.round(num(l.q)*num(l.price)*100)/100,0)-num(f.desconto.value)+num((sale?f.taxa:f.frete).value);$('#total').textContent=money(total);return Math.round(total*100)/100}function draw(){ $('#lines').innerHTML=lines.map((l,i)=>`<div class="line"><div><label>Produto</label><select data-i="${i}" data-k="id">${p.map(r=>`<option value="${r.id}" ${r.id===l.id?'selected':''}>${esc(r.nome)}</option>`).join('')}</select></div><div><label>Qtd.</label><input data-i="${i}" data-k="q" type="number" min="0.001" step="0.001" required value="${l.q}"></div><div><label>${sale?'Preço':'Custo'}</label><input data-i="${i}" data-k="price" type="number" min="0" step="${sale?'0.01':'0.0001'}" required value="${l.price}"></div><button type="button" class="alt" data-del="${i}">×</button></div>`).join('');document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let l=lines[+el.dataset.i];l[el.dataset.k]=el.value;if(el.dataset.k==='id'){l.price=p.find(r=>r.id===l.id)[sale?'preco_venda':'preco_custo'];draw()}calc()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.del,1);draw()});calc()}$('#addline').onclick=()=>{lines.push({id:p[0].id,q:1,price:p[0][sale?'preco_venda':'preco_custo']});draw()};$('#addline').click();f.oninput=calc;$('#close').onclick=()=>modal.close();f.onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let x=Object.fromEntries(new FormData(f));let total=calc();if(!lines.length||total<0||(sale&&total<=0))throw Error('Confira os produtos e o total.');let paid=sale?0:x.pago===''?(x.forma==='a_prazo'?0:total):num(x.pago);if(!sale&&paid>0&&!x.conta)throw Error('Selecione a conta de pagamento.');if((sale&&x.forma==='fiado'||!sale&&paid<total)&&!x.vencimento)throw Error('Informe o vencimento.');await rpc('registrar_operacao_app',{p_empresa_id:company.id,p_venda:sale,p_dados:{...x,total,pago:paid},p_itens:lines.map(l=>({produto_id:l.id,quantidade:num(l.q),preco:num(l.price)}))});modal.close();await render()}catch(e){msg(e,$('#modalmsg'))}finally{b.disabled=false}}}catch(e){msg(e)}}
async function detail(sale,r){try{let d=await run(db.from(sale?'itens_venda':'itens_compra').select('*,produtos(nome)').eq(sale?'venda_id':'compra_id',r.id));modal.innerHTML=`<h2>${sale?'Venda':'Compra'} — ${esc(r.situacao)}</h2>${table(d,[['Produto',x=>x.produtos?.nome],['Quantidade','quantidade'],['Total',x=>money(x.valor_total)]])}<p>Total: <strong>${money(r.valor_total)}</strong></p><div id="modalmsg"></div><div class="actions">${(sale&&r.situacao!=='cancelada'||!sale&&r.situacao==='rascunho')?'<button class="danger" id="cancel">Cancelar registro</button>':''}<button class="alt" id="close">Voltar</button></div>`;modal.showModal();$('#close').onclick=()=>modal.close();if($('#cancel'))$('#cancel').onclick=async()=>{let motivo=prompt('Motivo do cancelamento:');if(!motivo?.trim())return;try{await rpc(sale?'cancelar_venda':'cancelar_compra_rascunho',{[sale?'p_venda_id':'p_compra_id']:r.id,p_motivo:motivo});modal.close();render()}catch(e){msg(e,$('#modalmsg'))}}}catch(e){msg(e)}}
